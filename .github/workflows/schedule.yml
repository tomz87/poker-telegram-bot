name: Schedule Poker Bot

on:
  schedule:
    # Israel winter UTC+2:
    # Sat 20:00 IL => 18:00 UTC
    - cron: "0 18 * * SAT"  # ask_ws
    # Tue 20:00 IL => 18:00 UTC
    - cron: "0 18 * * TUE"  # ask_su
    # Sat 22:00 IL => 20:00 UTC
    - cron: "0 20 * * SAT"  # poll_ws
    # Tue 22:00 IL => 20:00 UTC
    - cron: "0 20 * * TUE"  # poll_su
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call Render trigger
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          SECRET: ${{ secrets.TRIGGER_SECRET }}
          SCH: ${{ github.event.schedule }}
        run: |
          echo "schedule=$SCH"

          if [ "$SCH" = "0 18 * * SAT" ]; then
            ACTION="ask_ws"
          elif [ "$SCH" = "0 18 * * TUE" ]; then
            ACTION="ask_su"
          elif [ "$SCH" = "0 20 * * SAT" ]; then
            ACTION="poll_ws"
          elif [ "$SCH" = "0 20 * * TUE" ]; then
            ACTION="poll_su"
          else
            # workflow_dispatch או משהו אחר
            ACTION="ask_ws"
          fi

          echo "Calling: $BASE_URL/trigger/$ACTION"
          curl -sS -X POST "$BASE_URL/trigger/$ACTION" \
            -H "X-Trigger-Token: $SECRET" \
            -H "Content-Type: application/json" \
            -d "{}"
